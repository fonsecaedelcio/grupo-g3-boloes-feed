name: Peça padrão de bolões (por loja)

on:
  workflow_dispatch:
  schedule:
    # Horários em UTC (Brasília = UTC-3). Quarta e sexta; o robô Postagem G3
    # pega a peça às 11h50 e publica às 12h. Duas execuções por causa de atraso do GitHub.
    - cron: "5 13 * * 3,5"   # 10h05
    - cron: "5 14 * * 3,5"   # 11h05 (repetição, com a vitrine mais recente)
  # O agendador do GitHub falhou nos dois horários em 25/11. O PC envia a vitrine
  # (boloes.json) a cada 10 min; esse envio também gera a peça, só qua/sex
  # entre 9h e 11h40 (Brasília): uma vez no dia e mais uma atualização depois das 11h.
  push:
    branches: [main]
    paths:
      - boloes.json

permissions:
  contents: write

concurrency:
  group: pecas-bolao
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se é hora de gerar
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          dow=$(TZ=America/Sao_Paulo date +%u)
          hhmm=$(TZ=America/Sao_Paulo date +%H%M)
          hoje=$(TZ=America/Sao_Paulo date +%F)
          data=$(jq -r '.data // ""' pecas/bolao.json 2>/dev/null || echo "")
          gerado=$(jq -r '.gerado // ""' pecas/bolao.json 2>/dev/null || echo "")
          go=false
          if { [ "$dow" = "3" ] || [ "$dow" = "5" ]; } && [ "$hhmm" -ge 900 ] && [ "$hhmm" -le 1140 ]; then
            if [ "$data" != "$hoje" ]; then go=true
            elif [ "$hhmm" -ge 1100 ] && [[ "$gerado" < "${hoje}T14:00" ]]; then go=true
            fi
          fi
          echo "dia=$dow hora=$hhmm peça=$data gerado=$gerado -> $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Preparar Node.js
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        if: steps.guard.outputs.go == 'true'
        working-directory: resultados-card
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Gerar as peças com a vitrine atual
        if: steps.guard.outputs.go == 'true'
        run: node resultados-card/bolao.mjs

      - name: Publicar as peças
        if: steps.guard.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Grupo G3 Peças"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/pecas && cp pecas/bolao* /tmp/pecas/
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -f pecas/bolao* && cp /tmp/pecas/* pecas/
            git add pecas
            if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
            git commit -m "Peça de bolões $(jq -r .data pecas/bolao.json)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 5))
          done
          exit 1
