name: Cards de resultados das loterias

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data dos sorteios (dd/mm/aaaa). Vazio = automático"
        required: false
  schedule:
    # Horários em UTC (Brasília = UTC-3). O agendador do GitHub pode atrasar,
    # por isso há duas execuções por dia.
    # O GitHub chega a atrasar horas os agendamentos (domingo 22/11 rodou 6 h depois),
    # por isso há várias repetições. O robô do n8n posta uma vez só por dia (trava).
    - cron: "17 8 * * 2-6"   # ter a sáb, 5h17 (sorteios da noite anterior)
    - cron: "47 9 * * 2-6"   # 6h47
    - cron: "23 11 * * 2-6"  # 8h23
    - cron: "53 12 * * 2-6"  # 9h53
    - cron: "11 15 * * 0"    # domingo, 12h11 (sorteios das 11h)
    - cron: "41 15 * * 0"    # 12h41
    - cron: "19 16 * * 0"    # 13h19
    - cron: "49 16 * * 0"    # 13h49
    - cron: "29 17 * * 0"    # 14h29

permissions:
  contents: write

concurrency:
  group: cards-resultados
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: resultados-card
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Gerar os cards
        env:
          DATA_ALVO: ${{ github.event.inputs.data }}
        run: node resultados-card/render.mjs

      - name: Publicar os cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Grupo G3 Resultados"
          git config user.email "actions@users.noreply.github.com"
          cp -r resultados /tmp/resultados
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf resultados && cp -r /tmp/resultados resultados
            git add resultados
            if git diff --cached --quiet; then
              echo "Nada novo para publicar."
              exit 0
            fi
            git commit -m "Cards de resultados $(jq -r .data resultados/hoje.json)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 5))
          done
          exit 1
